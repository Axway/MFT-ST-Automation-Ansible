---
backup_filename: backup-{{ inventory_hostname }}-update_{{ current_st_version }}-{{ ansible_date_time.date }}.tar.gz

# vars for repository.axway.com
base_url: "https://repository.axway.com/api/v1"
token_url: "https://login.axway.com/auth/realms/Broker/protocol/openid-connect/token"
download_base: "https://bin.repository.axway.com/download/"
artifact_facets:
  groups:
    type:
      webliv.type: ["Update"]
    product:
      webliv.sfdc.products.name: ["SecureTransport"]
      webliv.status: ["GA"]
  sort: "webliv.updated"
  order: "desc"
  limit: 1

# You can overwrite any of the variables set in the external vars file here, like so:

# ST_USER: root
# ST_USER_UID: 0
# ST_GROUP: root
# vars file for st_update
